<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Creatine on and off phases, vertical timeline</title>
<desc>Vertical timeline from 31 August: on for 1 week, off for 1 week, on for 4 weeks, off for 4 weeks, on for 8 weeks, then off for 8 weeks from 4 January.</desc>
<line x1="150" y1="58" x2="150" y2="110" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
<line x1="150" y1="122" x2="150" y2="174" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
<line x1="150" y1="186" x2="150" y2="238" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
<line x1="150" y1="250" x2="150" y2="302" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
<line x1="150" y1="314" x2="150" y2="366" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
<text x="134" y="52" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="400" fill="#FAF9F5">31 Aug</text>
<circle cx="150" cy="52" r="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<g><rect x="180" y="30" width="300" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="196" y="46" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">On creatine</text><text x="196" y="63" dominant-baseline="central" font-size="12" font-weight="400" fill="#5DCAA5">1 week</text></g>
<text x="134" y="116" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="400" fill="#FAF9F5">7 Sep</text>
<circle cx="150" cy="116" r="6" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<g><rect x="180" y="94" width="300" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/><text x="196" y="110" dominant-baseline="central" font-size="14" font-weight="500" fill="#D3D1C7">Off creatine</text><text x="196" y="127" dominant-baseline="central" font-size="12" font-weight="400" fill="#B4B2A9">1 week</text></g>
<text x="134" y="180" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="400" fill="#FAF9F5">14 Sep</text>
<circle cx="150" cy="180" r="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<g><rect x="180" y="158" width="300" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="196" y="174" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">On creatine</text><text x="196" y="191" dominant-baseline="central" font-size="12" font-weight="400" fill="#5DCAA5">4 weeks</text></g>
<text x="134" y="244" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="400" fill="#FAF9F5">12 Oct</text>
<circle cx="150" cy="244" r="6" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<g><rect x="180" y="222" width="300" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/><text x="196" y="238" dominant-baseline="central" font-size="14" font-weight="500" fill="#D3D1C7">Off creatine</text><text x="196" y="255" dominant-baseline="central" font-size="12" font-weight="400" fill="#B4B2A9">4 weeks</text></g>
<text x="134" y="308" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="400" fill="#FAF9F5">9 Nov</text>
<circle cx="150" cy="308" r="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<g><rect x="180" y="286" width="300" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="196" y="302" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">On creatine</text><text x="196" y="319" dominant-baseline="central" font-size="12" font-weight="400" fill="#5DCAA5">8 weeks</text></g>
<text x="134" y="372" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="400" fill="#FAF9F5">4 Jan</text>
<circle cx="150" cy="372" r="6" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<g><rect x="180" y="350" width="300" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/><text x="196" y="366" dominant-baseline="central" font-size="14" font-weight="500" fill="#D3D1C7">Off creatine</text><text x="196" y="383" dominant-baseline="central" font-size="12" font-weight="400" fill="#B4B2A9">8 weeks</text></g>
